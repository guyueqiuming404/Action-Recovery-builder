
name: Make Recovery

on:
  workflow_dispatch:
    inputs:
      LIBRARY_NAME:
        description: 'LIBRARY_NAME'
        required: true
        default: 'twrp'
      LIBRARY_URL:
        description: 'LIBRARY_URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git'
      LIBRARY_BRANCH:
        description: 'LIBRARY_BRANCH'
        required: true
        default: 'twrp-11'
      DEVICE_URL:
        description: 'DEVICE_URL'
        required: true
        default: 'https://github.com/HK4567/twrp_device_lenovo_TB-J706F.git'
      DEVICE_BRANCH:
        description: 'DEVICE_BRANCH'
        required: true
        default: 'Android-11-test'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/lenovo/J706F'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'J706F'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest

    steps:
    - name: Maximize GitHub Runner Space
      uses: justinthelaw/maximize-github-runner-space@v0.8.0
      with:
        cleanup-profile: custom
        remove-android: "true"
        remove-codeql: "true"
        remove-cached-tools: "true"
        remove-docker-images: "true"

    - name: Check Out
      uses: actions/checkout@main

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ github.run_id }}
        restore-keys: ccache-

    - name: Prepare the environment
      run: |
        sudo apt update
        java -version
        echo "4" | sudo update-alternatives --config java
        echo JAVA_HOME=\"/usr/lib/jvm/jdk-8\" | sudo tee -a /etc/environment
        echo PATH=\"$PATH:$JAVA_HOME/bin\" | sudo tee -a /etc/environment
        source /etc/environment
        java -version
        sudo apt -y install git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib \
        g++-multilib libc6-dev-i386 x11proto-core-dev libx11-dev tree lib32z-dev \
        libgl1-mesa-dev libxml2-utils xsltproc unzip jq bc bison build-essential ccache curl flex \
        g++-multilib gcc-multilib git gnupg gperf lib32ncurses-dev lib32readline-dev lib32z1-dev \
        liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
        rsync schedtool squashfs-tools xsltproc zip zlib1g-dev imagemagick libbz2-dev libssl-dev \
        lzma ncftp bash-completion python-is-python3 openjdk-8-jdk qemu-user-static
        java -version

    - name: Set variables
      run: |
        echo "date=$(date +%F)" >> $GITHUB_OUTPUT
      id: var

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: Initialize repo
      run: |
        PATH=~/bin:$PATH
        mkdir workspace
        cd workspace
        echo "pwd=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "Hikaru's Action-Build-Bot"
        git config --global user.email "Android@teio.tk"
        repo init --depth=1 -u ${{ github.event.inputs.LIBRARY_URL }} -b ${{ github.event.inputs.LIBRARY_BRANCH }}
      id: pwd

    - name: Repo Sync
      run: |
        PATH=~/bin:$PATH
        cd workspace
        repo sync -j$(nproc --all)

    - name: Clone device
      run: |
        PATH=~/bin:$PATH
        cd ${{ steps.pwd.outputs.pwd }}
        git clone ${{ github.event.inputs.DEVICE_URL }} -b ${{ github.event.inputs.DEVICE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}

    - name: Building
      run: |
        PATH=~/bin:$PATH
        cd ${{ steps.pwd.outputs.pwd }}
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        ccache -M 50G
        source build/envsetup.sh
        lunch ${{ github.event.inputs.LIBRARY_NAME }}_${{ github.event.inputs.DEVICE_NAME }}-eng
        make clean
        make recoveryimage -j$(nproc --all)

    - name: Upload recovery artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: recovery-${{ github.event.inputs.DEVICE_NAME }}
        path: workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
        if-no-files-found: warn

    - name: Upload to Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: Recovery for ${{ github.event.inputs.DEVICE_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
